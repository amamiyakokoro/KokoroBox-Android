# ============================================
# Project Metadata
# ============================================
project.name=KokoroBox
project.applicationId=com.amamiyakokoro.box
project.version.name=0.8.2
project.version.code=8200
project.jvm=17
# ============================================
# Namespace Configuration (project.namespace.*)
# ============================================
project.namespace.base=com.amamiyakokoro.box
# ============================================
# Android SDK Configuration (android.*)
# ============================================
android.compileSdk=37
android.minSdk=26
android.targetSdk=37
android.suppressUnsupportedCompileSdk=37.0
android.jvm=17
android.ndkVersion=29.0.14206865
# ============================================
# ABI Configuration (abi.*)
# ============================================
abi.app.list=arm64-v8a
# ============================================
# Gradle Configuration
# ============================================
# Android
android.useAndroidX=true
android.enableNewApkCreator=true
android.enableR8.fullMode=true
android.packagingOptions.jniLibs.useLegacyPackaging=false
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8
# Gradle
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configureondemand=false
# Kotlin
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.jvm.options=-Xmx4g -XX:+UseG1GC
kotlin.incremental.multiplatform=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
