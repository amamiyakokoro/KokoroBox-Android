name: Build arm64-v8a Release APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag / branch / commit to build"
        required: true
        default: "v0.5.2"
        type: string

jobs:
  build:
    name: Build arm64-v8a Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.31.6"

      - name: Set Android native environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.31.6/bin" >> "$GITHUB_PATH"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true
          cache-dependency-path: |
            lib/native/go/go.sum
            lib/native/go/go.mod
            lib/mihomo/go.sum
            lib/mihomo/go.mod
            lib/mihomo/mihomo/go.sum
            lib/mihomo/mihomo/go.mod

      - name: Set up Kotlin command
        run: |
          curl -sSLO https://github.com/JetBrains/kotlin/releases/download/v2.3.10/kotlin-compiler-2.3.10.zip
          unzip -q kotlin-compiler-2.3.10.zip -d "$HOME/kotlin"
          echo "$HOME/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: |
          chmod +x ./gradlew
          find scripts -name "*.sh" -type f -exec chmod +x {} \; || true

      - name: Print environment
        run: |
          echo "=== Git ==="
          git rev-parse HEAD
          git status --short

          echo "=== Java ==="
          java -version
          javac -version

          echo "=== Kotlin ==="
          kotlin -version

          echo "=== Gradle ==="
          ./gradlew --version

          echo "=== Android ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          ls "$ANDROID_HOME/ndk" || true
          ls "$ANDROID_HOME/cmake" || true

          echo "=== Go ==="
          go version

          echo "=== CMake ==="
          cmake --version || true

      - name: Build native Go arm64-v8a
        run: |
          kotlin scripts/native-build.main.kts --go

      - name: List native outputs
        run: |
          echo "=== Native .so files ==="
          find . -name "*.so" -type f -exec ls -lh {} \; || true

      - name: Build arm64-v8a release APK
        run: |
          ./gradlew assembleReleaseArm64V8a

      - name: List APK files
        run: |
          echo "=== APK files ==="
          find . -name "*.apk" -type f -exec ls -lh {} \;

      - name: Check APK native libraries
        run: |
          APK=$(find app/build/outputs/apk/release -name "*arm64-v8a*release*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "No arm64-v8a release APK found in app/build/outputs/apk/release"
            echo "All APK files:"
            find . -name "*.apk" -type f -exec ls -lh {} \;
            exit 1
          fi

          echo "APK=$APK"

          echo "=== SHA256 ==="
          sha256sum "$APK"

          echo "=== Native libs in APK ==="
          unzip -l "$APK" | grep "lib/" || true

          echo "=== Check ABI ==="
          if unzip -l "$APK" | grep -E "lib/(armeabi-v7a|x86|x86_64)/"; then
            echo "Unexpected non-arm64-v8a native libraries found"
            exit 1
          fi

          if ! unzip -l "$APK" | grep "lib/arm64-v8a/"; then
            echo "No arm64-v8a native libraries found"
            exit 1
          fi

      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk/release -name "*arm64-v8a*release*.apk" | head -n 1)
          echo "APK=$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "APKSIGNER=$APKSIGNER"

          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload arm64-v8a release APK
        uses: actions/upload-artifact@v4
        with:
          name: YumeBox-arm64-v8a-release
          path: app/build/outputs/apk/release/*arm64-v8a*release*.apk
