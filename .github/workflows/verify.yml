name: Verify

on:
  pull_request:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android platform
        shell: bash
        run: |
          sdk_major="$(sed -n 's/^android\.compileSdk=//p' gradle.properties)"
          if [[ ! "$sdk_major" =~ ^[0-9]+$ ]]; then
            echo "Invalid android.compileSdk: $sdk_major" >&2
            exit 1
          fi

          if (( sdk_major >= 37 )); then
            sdk_package="${sdk_major}.0"
          else
            sdk_package="$sdk_major"
          fi

          sdkmanager "platforms;android-$sdk_package" "build-tools;37.0.0"

      - name: Verify native bridge namespace
        run: ./gradlew app:verifyBridgeJniNamespace

      - name: Run unit tests, lint and debug build
        run: ./gradlew testDebugUnitTest lintDebug app:assembleDebug

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore
          retention-days: 7
