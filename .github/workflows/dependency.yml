name: Dependency Review

on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v6
      - name: 'Check Dependency Graph availability'
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/${{ github.repository }}" --jq '.security_and_analysis.dependency_graph.status // "disabled"')
          echo "enabled=$([ "$status" = "enabled" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: 'Dependency Review'
        if: steps.dependency-graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v4
      - name: 'Skip Dependency Review (Dependency Graph disabled)'
        if: steps.dependency-graph.outputs.enabled != 'true'
        run: echo "Dependency Graph is disabled for this repository. Skipping dependency review."